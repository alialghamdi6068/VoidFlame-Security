#!/usr/sbin/nft -f

table inet filter {
    chain voidflame_mc {
        type filter hook input priority -5; policy accept;

        # Keep established traffic working.
        ct state established,related accept

        # Bound new Minecraft connections to protect the host from obvious bursts.
        # This is host-level rate limiting, not upstream DDoS scrubbing.
        tcp dport 25565 ct state new limit rate over 40/second burst 80 packets drop

        # Bound SYN bursts separately.
        tcp dport 25565 tcp flags syn limit rate over 80/second burst 120 packets drop
    }
}
