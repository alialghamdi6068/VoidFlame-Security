#!/usr/sbin/nft -f

flush chain inet filter voidflame_mc 2>/dev/null || true

table inet filter {
    chain voidflame_mc {
        type filter hook input priority -5; policy accept;

        # Keep established traffic working.
        ct state established,related accept

        # Limit new Minecraft TCP connections per source.
        tcp dport 25565 ct state new limit rate over 40/10 seconds burst 20 packets drop

        # Limit obvious empty/fragmented TCP abuse without blocking normal gameplay.
        tcp dport 25565 tcp flags syn limit rate over 80/second burst 120 packets drop
    }
}
