global
    log stdout format raw local0
    maxconn 10000
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    mode tcp
    timeout connect 5s
    timeout client  2m
    timeout server  2m
    option tcplog

frontend minecraft_in
    bind :25565
    mode tcp

    # Per-source connection-rate protection.
    stick-table type ip size 200k expire 10m store conn_rate(10s),conn_cur
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_rate gt 40 }
    tcp-request connection reject if { sc0_conn_cur gt 20 }

    default_backend minecraft_backend

backend minecraft_backend
    mode tcp
    server minecraft BACKEND_IP:25565 check maxconn 5000
