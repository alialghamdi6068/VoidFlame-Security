# VoidFlame Security | VoidFlameMC Practice & Duels
# Paper 26.2 / Java 25. Keep network-level DDoS protection at the host/proxy/firewall.

settings:
  enabled: true
  lockdown: false
  module: security
  max-actions-per-second: 8
  violation-window-seconds: 10
  action-rate-kick-threshold: 30
  join-burst-protection: true
  packet-abuse-protection: true
  exploit-detection: true
  false-positive-cooldown-seconds: 30
  whitelist-enabled: true
  whitelist-gui-size: 54
  whitelist-gui-title: "§8Security Whitelist"
  whitelist-gui-player-item: LIME_DYE
  whitelist-gui-player-name: "§a<player>"
  whitelist-gui-disabled-item: GRAY_DYE
  whitelist-gui-disabled-name: "§7<player>"

antibot:
  join-threshold: 4
  join-window-seconds: 8
  always-check-new-players: true
  attack-mode-multiplier: 3
  decay-seconds: 300

captcha:
  size: 27
  timeout-seconds: 15
  max-attempts: 2
  verification-hours: 24
  title: "§8Security Verification"
  correct-item: EMERALD
  filler-item: GRAY_STAINED_GLASS_PANE
  correct-name: "§aClick the correct item"
  filler-name: "§7Verification"

combat-tag:
  enabled: true
  seconds: 15
  drop-inventory-on-logout: true
  # The normal Minecraft death path still controls full-loot drops on actual death.
  # A combat logout drops storage, armor and offhand at the player's last location.

new-account-protection:
  enabled: true
  min-account-age-days: 7
  max-actions-per-minute: 30

escalation:
  verify-score: 5
  throttle-score: 10
  block-score: 20
  block-seconds: 60

whitelist:
  enabled: true
  bypass-captcha: true
  bypass-rate-limits: true
  bypass-new-account-protection: true

anti-cheat:
  enabled: true
  movement:
    enabled: true
    max-horizontal-per-event: 1.25
    max-vertical-per-event: 2.25
    flag-after: 4
    velocity-grace-ms: 750
    teleport-grace-ms: 1500
  combat:
    enabled: true
    max-reach: 4.25
    min-attack-interval-ms: 45
    flag-after-fast-attacks: 8


connection:
  window-seconds: 10
  max-per-ip: 8
  max-burst-per-ip: 4
  hard-deny-on-burst: true
  hard-deny-on-high-mode: true

correlation:
  subnet-window-seconds: 10
  active-subnet-threshold: 4
  max-joins-per-subnet: 20
  critical-subnet-joins: 40
  critical-active-subnets: 3

attack-mode:
  elevated-joins: 4
  high-joins: 10
  critical-joins: 20
  lockdown-joins: 35
  tps-high: 16.0
  tps-critical: 14.0

blocking:
  ip-block-seconds: 300
  subnet-block-seconds: 600
  block-subnet-on-correlation: true
  trusted-slots-only: true

verified-cache:
  temporary-trust-seconds: 120

packets:
  max-plugin-message-bytes: 32767
  max-payloads-per-second: 30

actions:
  max-interact-per-second: 18
  max-inventory-per-second: 18

commands:
  max-per-second: 6
  max-tree-sends-per-second: 3

chat:
  max-per-second: 5

lockdown:
  reserved-trusted-slots: 5
  deny-new-connections: true
  require-trusted-identity: true

alerts:
  enabled: true
  cooldown-seconds: 15
  message-prefix: "§5[Security] §f"
  discord-webhook: ""
