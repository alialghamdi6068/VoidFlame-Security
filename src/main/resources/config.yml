# ================================================================
# VoidFlame Security • Production Configuration
# Paper 26.2 • Java 25
# ================================================================
# Anti-bot, CAPTCHA, rate limits, escalation and whitelist controls.
settings:
  enabled: true
  lockdown: false
  module: security
  max-actions-per-second: 8
  violation-window-seconds: 10
  action-rate-kick-threshold: 30
  join-burst-protection: true
  packet-abuse-protection: true
  exploit-detection: true
  false-positive-cooldown-seconds: 30
  whitelist-enabled: true
  whitelist-gui-size: 54
  whitelist-gui-title: "§8Security Whitelist"
  whitelist-gui-player-item: LIME_DYE
  whitelist-gui-player-name: "§a<player>"
  whitelist-gui-disabled-item: GRAY_DYE
  whitelist-gui-disabled-name: "§7<player>"

antibot:
  join-threshold: 4
  join-window-seconds: 8
  always-check-new-players: true
  attack-mode-multiplier: 3
  decay-seconds: 300

captcha:
  size: 27
  timeout-seconds: 15
  max-attempts: 2
  verification-hours: 24
  title: "§8🛡 Security Verification"
  correct-item: EMERALD
  filler-item: GRAY_STAINED_GLASS_PANE
  correct-name: "§aClick the correct item"
  filler-name: "§7Verification"

messages:
  lockdown: "&cThe server is temporarily locked down by security protection."
  verified: "§a✓ Verification successful."
  failed: "§cVerification failed."
  timeout: "§cVerification timed out."
  join-flood: "§cJoin flood protection is active."
  temporarily-blocked: "§cSecurity protection is active. Please try again later."
  escalated-kick: "§cSecurity protection triggered."

new-account-protection:
  enabled: true
  min-account-age-days: 7
  max-actions-per-minute: 30

escalation:
  verify-score: 5
  throttle-score: 10
  block-score: 20
  block-seconds: 60

whitelist:
  enabled: true
  bypass-captcha: true
  bypass-rate-limits: true
  bypass-new-account-protection: true

# Conservative server-side anomaly detection. These checks flag repeated
# impossible patterns and feed the existing risk/escalation system.
anti-cheat:
  enabled: true
  movement:
    enabled: true
    max-horizontal-per-event: 1.25
    max-vertical-per-event: 2.25
    flag-after: 4
    velocity-grace-ms: 750
    teleport-grace-ms: 1500
  combat:
    enabled: true
    max-reach: 4.25
    min-attack-interval-ms: 45
    flag-after-fast-attacks: 8

authentication:
  # In auto mode, local registration/login is enforced only when server.properties online-mode=false.
  # Online-mode servers keep Mojang authentication and do not ask players for passwords.
  enabled: true
  mode: auto
  password-min-length: 8
  max-attempts: 5
  lock-seconds: 300
  pbkdf2-iterations: 210000
  # Unauthenticated players are isolated in a generated empty world until login/register succeeds.
  void-world:
    enabled: true
    name: "VoidFlame-Auth"
  release-world: "world"
  messages:
    notice: "&7Local authentication is enabled for offline-mode servers."
    register: "&5VoidFlame &7» &fRegister: &d/register <password> <confirm>"
    login: "&5VoidFlame &7» &fLogin: &d/login <password>"
    required: "&cYou must register or login before playing."
    register-usage: "&cUsage: /register <password> <confirm>"
    login-usage: "&cUsage: /login <password>"
    invalid-password: "&cPassword contains unsupported characters."
    registered: "&aRegistration successful. You are now authenticated."
    invalid: "&cInvalid password."
    logged-in: "&aLogin successful."
    too-many-attempts: "&cToo many authentication attempts. Please reconnect later."

# ================================================================
# Advanced network / attack protection
# ================================================================
connection:
  # Per-IP connection admission control.
  window-seconds: 10
  max-per-ip: 8
  max-burst-per-ip: 4
  hard-deny-on-burst: true
  hard-deny-on-high-mode: true

correlation:
  subnet-window-seconds: 10
  active-subnet-threshold: 4
  max-joins-per-subnet: 20
  critical-subnet-joins: 40
  critical-active-subnets: 3

attack-mode:
  # Automatic global escalation based on recent connections/joins and TPS.
  elevated-joins: 4
  high-joins: 10
  critical-joins: 20
  lockdown-joins: 35
  tps-high: 16.0
  tps-critical: 14.0

blocking:
  ip-block-seconds: 300
  subnet-block-seconds: 600
  block-subnet-on-correlation: true
  # Reserved slots are protected for trusted/verified/staff players in lockdown.
  trusted-slots-only: true

verified-cache:
  temporary-trust-seconds: 120

packets:
  # These are safe Bukkit/Paper-level payload guards. Raw Netty/NMS packet
  # interception is intentionally not used because it is version-internal.
  max-plugin-message-bytes: 32767
  max-payloads-per-second: 30

actions:
  max-interact-per-second: 18
  max-inventory-per-second: 18

commands:
  max-per-second: 6
  max-tree-sends-per-second: 3

chat:
  max-per-second: 5

lockdown:
  reserved-trusted-slots: 5
  deny-new-connections: true
  require-trusted-identity: true

alerts:
  enabled: true
  cooldown-seconds: 15
  message-prefix: "§5[Security] §f"
  # Leave empty to disable. Never commit a real webhook URL to GitHub.
  discord-webhook: ""

# Paper's public API does not expose a stable raw-Netty packet interception
# contract. The plugin therefore implements connection/login/payload guards
# through supported events instead of brittle NMS channel injection.
\n